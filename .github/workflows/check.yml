# Source and production-build validation, plus production deploy for `main`.
# Replaces a separate Cloudflare Workers Builds setup with a single pinned,
# least-privilege GH Actions workflow that owns:
#  - PR + push: install → format → typecheck → lint → unit tests → build.
#  - main only: same checks, then `wrangler deploy` using CLOUDFLARE_API_TOKEN.
name: quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Public build-time placeholders only — never put service-role or Resend keys here.
    # Production secrets live in CLOUDFLARE_API_TOKEN (Worker deploy) and Worker bindings.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: "1x00000000000000000000AA"
    steps:
      - name: Checkout
        # actions/checkout@v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Bun
        # oven-sh/setup-bun@v2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Cache Bun install
        # Cache the Bun install dir keyed on the lockfile hash.
        # Restores dependencies on subsequent runs (≈30s saved on cold install).
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        # Fail-fast on formatting before heavier checks.
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun run test:run

      - name: Production build
        # Mirrors the Workers deploy bundle; ensures `next build` and
        # `opennextjs-cloudflare build` succeed on CI.
        run: bun run build && node ./node_modules/@opennextjs/cloudflare/dist/cli/index.js build

  deploy:
    name: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'HuynhSang2005/portfolio'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only run on green quality, on push to main, on the canonical repo.
    environment:
      name: production
      url: https://portfolio.huynhsang.id.vn
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: "1x00000000000000000000AA"
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-deploy-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-deploy-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: OpenNext build (Worker bundle)
        run: node ./node_modules/@opennextjs/cloudflare/dist/cli/index.js build

      - name: Deploy to Cloudflare Workers
        # `wrangler deploy` via OpenNext CLI — Workers secret material lives in
        # the Cloudflare dashboard, not in this job. Token only needs Workers
        # Scripts: Edit for the `portfolio` worker.
        run: node ./node_modules/@opennextjs/cloudflare/dist/cli/index.js deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
