name: quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
  NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Cache Bun downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Format check
        run: bun run format:check
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Unit tests
        run: bun run test:run
      - name: Next production build
        run: bun run build
      - name: OpenNext Worker build
        run: node ./node_modules/@opennextjs/cloudflare/dist/cli/index.js build
      - name: Upload immutable Worker artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: open-next-${{ github.sha }}
          path: |
            .open-next
            wrangler.jsonc
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'HuynhSang2005/portfolio'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://portfolio.huynhsang.id.vn
    steps:
      - name: Checkout deployment metadata
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          sparse-checkout: wrangler.jsonc
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Install OpenNext deploy tooling
        run: bun add --global wrangler@4.114.0
      - name: Download immutable Worker artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: open-next-${{ github.sha }}
          path: .
      - name: Deploy exact quality artifact
        run: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Canonical GET smoke
        shell: bash
        run: |
          set -euo pipefail
          for path in / /blog /craft /contact /robots.txt /sitemap.xml /feed.xml; do
            status=$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' "https://portfolio.huynhsang.id.vn${path}")
            test "$status" = 200 || { echo "${path}: HTTP ${status}"; exit 1; }
            echo "${path}: HTTP 200"
          done
